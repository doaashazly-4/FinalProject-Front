<div class="min-h-screen bg-slate-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md">
    <!-- Back Button -->
    <button (click)="goBack()"
      class="mb-8 flex items-center gap-3 text-slate-500 hover:text-slate-900 transition-all group font-bold">
      <div
        class="w-10 h-10 rounded-xl bg-white shadow-soft flex items-center justify-center group-hover:bg-slate-900 group-hover:text-white transition-all">
        <lucide-icon [name]="step === 'otp' ? 'arrow-right' : 'home'" class="w-5 h-5"></lucide-icon>
      </div>
      <span class="text-sm tracking-widest uppercase">{{ step === 'otp' ? 'تعديل الرقم' : 'الرئيسية' }}</span>
    </button>

    <!-- Card -->
    <div class="bg-white rounded-[2.5rem] shadow-premium p-10 border border-slate-100 animate-slide-up">
      <!-- Header -->
      <div class="text-center mb-10">
        <div
          class="w-20 h-20 mx-auto mb-6 rounded-3xl bg-brand-50 text-brand-600 flex items-center justify-center shadow-soft">
          <lucide-icon name="smartphone" class="w-10 h-10"></lucide-icon>
        </div>
        <h1 class="text-3xl font-black text-slate-900 mb-2">دخول العميل</h1>
        <p class="text-slate-500 font-medium">{{ step === 'phone' ? 'أدخل رقم جوالك للمتابعة' : 'أدخل رمز التحقق المرسل
          إليك' }}</p>
      </div>

      <!-- Messages -->
      <div *ngIf="errorMessage"
        class="mb-6 p-4 bg-red-50 border border-red-100 text-red-700 rounded-2xl flex items-center gap-3 text-sm font-bold animate-fade-in">
        <lucide-icon name="alert-circle" class="w-5 h-5 shrink-0"></lucide-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <div *ngIf="successMessage"
        class="mb-6 p-4 bg-brand-50 border border-brand-100 text-brand-700 rounded-2xl flex items-center gap-3 text-sm font-bold animate-fade-in">
        <lucide-icon name="check-circle" class="w-5 h-5 shrink-0"></lucide-icon>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Phone Step -->
      <div *ngIf="step === 'phone'" class="animate-fade-in">
        <form [formGroup]="phoneForm" (ngSubmit)="onPhoneSubmit()" class="space-y-8">
          <div class="space-y-2">
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mr-1">رقم الجوال</label>
            <div class="relative">
              <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400">
                <lucide-icon name="phone" class="w-5 h-5"></lucide-icon>
              </div>
              <input type="tel" formControlName="phoneNumber" placeholder="05XXXXXXXX" dir="ltr"
                class="input pr-12 text-left h-16 text-xl tracking-wider"
                [class.border-red-500]="phoneForm.get('phoneNumber')?.invalid && phoneForm.get('phoneNumber')?.touched">
            </div>
            <p *ngIf="phoneForm.get('phoneNumber')?.invalid && phoneForm.get('phoneNumber')?.touched"
              class="text-xs font-bold text-red-500 mr-1">يرجى إدخال رقم جوال صحيح</p>
          </div>

          <button type="submit" [disabled]="phoneForm.invalid || isLoading"
            class="btn-primary w-full h-16 text-xl shadow-glow-blue">
            <span *ngIf="isLoading"
              class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            <span class="flex items-center gap-2">
              {{ isLoading ? 'جاري الإرسال...' : 'إرسال رمز التحقق' }}
              <lucide-icon *ngIf="!isLoading" name="send" class="w-5 h-5"></lucide-icon>
            </span>
          </button>
        </form>
      </div>

      <!-- OTP Step -->
      <div *ngIf="step === 'otp'" class="animate-fade-in">
        <form [formGroup]="otpForm" (ngSubmit)="onOTPSubmit()" class="space-y-8">
          <div class="space-y-6">
            <div class="text-center space-y-2">
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest leading-none">رمز التحقق
                (OTP)</label>
              <input type="text" formControlName="otp" placeholder="••••••" maxlength="6" dir="ltr"
                class="w-full h-20 bg-slate-50 border-2 border-slate-100 rounded-3xl text-center text-4xl font-black tracking-[0.5em] focus:bg-white focus:border-brand-500 transition-all outline-none"
                [class.border-red-500]="otpForm.get('otp')?.invalid && otpForm.get('otp')?.touched">
            </div>

            <p class="text-xs font-bold text-slate-500 text-center">
              تم إرسال الرمز إلى <span class="text-slate-900 font-black tracking-wider">{{ phoneForm.value.phoneNumber
                }}</span>
            </p>
          </div>

          <!-- Resend OTP -->
          <div class="text-center pt-2">
            <button type="button" (click)="resendOTP()" [disabled]="!resendAvailable || isLoading"
              class="text-sm font-black transition-all"
              [ngClass]="resendAvailable ? 'text-brand-600 hover:text-brand-700 underline' : 'text-slate-300 cursor-not-allowed'">
              <span *ngIf="!resendAvailable" class="flex items-center justify-center gap-2">
                <lucide-icon name="clock" class="w-4 h-4"></lucide-icon>
                إعادة الإرسال خلال {{ countdown }} ثانية
              </span>
              <span *ngIf="resendAvailable">إعادة إرسال الرمز</span>
            </button>
          </div>

          <button type="submit" [disabled]="otpForm.invalid || isLoading"
            class="btn-primary w-full h-16 text-xl shadow-glow-blue">
            <span *ngIf="isLoading"
              class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            <span class="flex items-center gap-2">
              {{ isLoading ? 'جاري التحقق...' : 'التحقق والدخول' }}
              <lucide-icon *ngIf="!isLoading" name="check-circle" class="w-5 h-5"></lucide-icon>
            </span>
          </button>
        </form>
      </div>

      <!-- Info Footer -->
      <div class="mt-10 pt-8 border-t border-slate-50">
        <div class="p-4 bg-slate-50 rounded-2xl flex items-center justify-center gap-3">
          <lucide-icon name="shield-check" class="w-5 h-5 text-slate-400"></lucide-icon>
          <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">نظام حماية البيانات الفائق</span>
        </div>
      </div>
    </div>
  </div>
</div>
