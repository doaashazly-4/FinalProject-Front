<div class="min-h-[80vh] flex flex-col justify-center items-center p-4 animate-fade-in">
    <!-- Success Container -->
    <div
        class="max-w-md w-full relative bg-white rounded-[3rem] p-8 lg:p-12 shadow-premium border border-slate-100 overflow-hidden text-center group">

        <!-- Animated Background Glow -->
        <div
            class="absolute -top-32 -left-32 w-64 h-64 bg-success-500/10 rounded-full blur-[80px] group-hover:bg-success-500/20 transition-all duration-1000">
        </div>
        <div
            class="absolute -bottom-32 -right-32 w-64 h-64 bg-brand-500/10 rounded-full blur-[80px] group-hover:bg-brand-500/20 transition-all duration-1000">
        </div>

        <div class="relative z-10 flex flex-col items-center">

            <!-- Success Icon -->
            <div
                class="w-24 h-24 rounded-[2rem] bg-gradient-to-br from-success-500 to-emerald-600 text-white flex items-center justify-center shadow-lg hover:scale-110 hover:rotate-6 transition-all duration-500 mb-8 animate-float">
                <lucide-icon name="shield-check" [size]="48" class="animate-pulse"></lucide-icon>
            </div>

            <h2 class="text-3xl font-black text-slate-900 leading-tight mb-2 tracking-tight">
                تم التوثيق بنجاح!
            </h2>
            <p class="text-slate-400 font-medium leading-relaxed mb-8">
                عملية التسليم موثقة وآمنة الآن. شكراً لاستخدامك خدمات Lynx اللوجستية.
            </p>

            <!-- Delivery Summary -->
            <div *ngIf="delivery" class="w-full bg-slate-50/80 rounded-3xl p-6 border border-slate-100 mb-8 space-y-4">
                <div class="flex justify-between items-center pb-4 border-b border-slate-200/50">
                    <span class="text-xs font-black text-slate-400 uppercase tracking-widest">رقم التتبع</span>
                    <span class="text-sm font-black text-slate-900 tracking-wider">{{ delivery.trackingNumber }}</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs font-black text-slate-400 uppercase tracking-widest">تاريخ الاستلام</span>
                    <span class="text-sm font-bold text-success-600">{{ delivery.actualDelivery | date:'short' }}</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="w-full space-y-4">
                <a [routerLink]="['/customer/orders', delivery?.id]"
                    class="w-full h-14 bg-slate-900 text-white rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-black transition-all flex items-center justify-center gap-3 shadow-lg hover:-translate-y-1">
                    <lucide-icon name="file-text" [size]="18"></lucide-icon>
                    استعراض تفاصيل الشحنة
                </a>

                <a routerLink="/customer/dashboard"
                    class="w-full h-14 bg-white text-slate-500 border border-slate-200 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-slate-50 hover:text-slate-900 transition-all flex items-center justify-center gap-3">
                    <lucide-icon name="layout-dashboard" [size]="18"></lucide-icon>
                    العودة للوحة التحكم
                </a>
            </div>
        </div>
    </div>
</div>
