<div
  class="flex flex-col h-[600px] bg-slate-50 rounded-[2.5rem] overflow-hidden border border-slate-100 shadow-premium relative">
  <!-- Dynamic Header (Optional context integration can go here if passed via inputs) -->
  <div class="p-6 bg-white border-b border-slate-100 flex items-center justify-between shrink-0 z-10">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center">
        <lucide-icon name="message-circle" [size]="24"></lucide-icon>
      </div>
      <div>
        <h3 class="font-black text-slate-900 leading-none mb-1">المحادثة المباشرة</h3>
        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> متصل الآن
        </p>
      </div>
    </div>
  </div>

  <!-- Messages Area -->
  <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar scroll-smooth" #messagesContainer>
    <!-- Empty State -->
    <div *ngIf="messages.length === 0"
      class="flex flex-col items-center justify-center h-full text-center space-y-4 opacity-50">
      <div class="w-20 h-20 rounded-[2rem] bg-slate-100 flex items-center justify-center text-slate-300">
        <lucide-icon name="message-square-dashed" [size]="40"></lucide-icon>
      </div>
      <p class="text-sm font-bold text-slate-400">لا توجد رسائل بعد.. ابدأ المحادثة!</p>
    </div>

    <div *ngFor="let msg of messages" class="flex gap-4 group" [ngClass]="{'flex-row-reverse': msg.sender === 'user'}">

      <!-- Avatar -->
      <div
        class="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 shadow-sm border border-slate-100 text-xs font-bold"
        [ngClass]="msg.sender === 'user' ? 'bg-brand-500 text-white' : 'bg-white text-slate-900'">
        {{ msg.sender === 'user' ? 'أنا' : 'D' }}
      </div>

      <!-- Bubble -->
      <div class="max-w-[75%] space-y-2">
        <div class="p-4 rounded-3xl shadow-sm relative overflow-hidden"
          [ngClass]="msg.sender === 'user' ? 'bg-brand-500 text-white rounded-tr-none' : 'bg-white text-slate-700 rounded-tl-none border border-slate-100'">

          <p class="text-sm font-medium leading-relaxed relative z-10">{{ msg.text }}</p>

          <!-- Image Attachment -->
          <div *ngIf="msg.imageUrl" class="mt-3 rounded-xl overflow-hidden shadow-md">
            <img [src]="msg.imageUrl" alt="Attachment"
              class="w-full h-auto object-cover max-h-48 group-hover:scale-105 transition-transform duration-500">
          </div>
        </div>

        <!-- Timestamp (if available) -->
        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block px-2"
          [ngClass]="{'text-left': msg.sender === 'user', 'text-right': msg.sender !== 'user'}">
          {{ msg.timestamp || 'الآن' }}
        </span>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="p-4 bg-white border-t border-slate-100 shrink-0">
    <div
      class="flex items-end gap-3 bg-slate-50 p-2 rounded-[2rem] border border-slate-100 transition-shadow focus-within:shadow-md focus-within:ring-2 focus-within:ring-brand-500/10">

      <!-- Attachment Button -->
      <button
        class="w-12 h-12 rounded-full hover:bg-white text-slate-400 hover:text-brand-500 transition-all flex items-center justify-center shrink-0 relative overflow-hidden"
        (click)="fileInput.click()">
        <lucide-icon name="paperclip" [size]="20"></lucide-icon>
        <input type="file" #fileInput (change)="onImageSelected($event)" class="hidden" accept="image/*">
        <!-- Badge if file selected -->
        <div *ngIf="selectedImage"
          class="absolute inset-0 bg-brand-500 flex items-center justify-center text-white animate-fade-in">
          <lucide-icon name="check" [size]="16"></lucide-icon>
        </div>
      </button>

      <!-- Text Input -->
      <textarea [(ngModel)]="messageText" (keyup.enter)="onSend()" placeholder="اكتب رسالتك هنا..." rows="1"
        class="flex-1 bg-transparent border-0 focus:ring-0 p-3 max-h-32 resize-none font-medium text-slate-700 placeholder:text-slate-400 custom-scrollbar mt-1.5"></textarea>

      <!-- Send Button -->
      <button (click)="onSend()" [disabled]="!messageText.trim() && !selectedImage"
        class="w-12 h-12 rounded-full bg-slate-900 text-white flex items-center justify-center shadow-lg hover:bg-black hover:scale-110 active:scale-95 transition-all disabled:opacity-50 disabled:scale-100 disabled:cursor-not-allowed mb-0.5">
        <lucide-icon name="send" [size]="20" class="mr-0.5 mt-0.5 rtl:ml-0.5 rtl:mr-0"></lucide-icon>
      </button>
    </div>
  </div>
</div>
