<div class="relative py-4 z-50">
    <!-- The Talisman (Trigger) -->
    <button (click)="toggleTalisman()" class="group relative flex items-center justify-center p-1 focus:outline-none"
        aria-label="Consult Lynx Talisman">
        <!-- Outer Glow Ring -->
        <div
            class="absolute inset-0 rounded-full blur bg-cyan-500/30 group-hover:bg-cyan-400/50 transition-all duration-700 animate-pulse-slow">
        </div>

        <!-- The Gem -->
        <div
            class="relative w-10 h-10 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center overflow-hidden shadow-xl transition-transform duration-300 group-hover:scale-105 group-active:scale-95">
            <!-- Gem Inner Gradient -->
            <div class="absolute inset-0 bg-gradient-to-br from-slate-800 to-black opacity-90"></div>

            <!-- The Eye / Sigil -->
            <div class="relative z-10 text-cyan-400 drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]">
                <i class="bi bi-eye-fill text-lg group-hover:text-cyan-300 transition-colors"></i>
            </div>

            <!-- Rotating Ring (Decorative) -->
            <div class="absolute inset-0 border border-t-cyan-500/60 border-transparent rounded-full animate-spin-slow">
            </div>
        </div>

        <!-- Connecting Line (Optional visual anchor) -->
        <!-- <div class="absolute left-1/2 -top-4 w-px h-4 bg-slate-700/50 -translate-x-1/2"></div> -->
    </button>

    <!-- The Revelation (Dropdown) -->
    <div *ngIf="isOpen" @talismanReveal class="absolute top-16 left-0 z-50 w-80 md:w-96">
        <div
            class="relative overflow-hidden rounded-xl border border-slate-700/60 bg-slate-900/95 shadow-2xl backdrop-blur-md">

            <!-- Header -->
            <div class="flex items-center justify-between px-4 py-3 bg-slate-800/50 border-b border-slate-700/50">
                <div class="flex items-center gap-2">
                    <i class="bi bi-cpu text-cyan-400 text-sm"></i>
                    <span class="text-xs font-mono font-bold tracking-widest text-cyan-100 uppercase">Lynx
                        Intelligence</span>
                </div>
                <div *ngIf="explanation"
                    class="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-slate-950/50 border border-slate-800">
                    <span class="w-1.5 h-1.5 rounded-full"
                        [ngClass]="isSystemDecision ? 'bg-cyan-500 shadow-[0_0_5px_rgba(6,182,212,1)]' : 'bg-amber-500 shadow-[0_0_5px_rgba(245,158,11,1)]'"></span>
                    <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">{{ explanation.source
                        }}</span>
                </div>
            </div>

            <!-- Content Area -->
            <div class="p-5">

                <!-- Loading State -->
                <div *ngIf="isLoading" class="flex flex-col items-center justify-center py-6 space-y-3">
                    <div class="relative w-8 h-8">
                        <div
                            class="absolute inset-0 rounded-full border-2 border-cyan-500/20 border-t-cyan-500 animate-spin">
                        </div>
                        <div
                            class="absolute inset-2 rounded-full border-2 border-cyan-500/20 border-b-cyan-500 animate-spin-reverse">
                        </div>
                    </div>
                    <p class="text-xs font-mono text-cyan-400/80 animate-pulse">Running Log Analysis...</p>
                </div>

                <!-- Error / Empty State -->
                <div *ngIf="!isLoading && (hasError || !explanation)" class="text-center py-4">
                    <p class="text-sm text-slate-400 italic">"The Lynx remained silent on this order."</p>
                    <p class="text-xs text-slate-600 mt-2">No decision data available.</p>
                </div>

                <!-- Explanation Content -->
                <div *ngIf="!isLoading && explanation">
                    <div class="prose prose-invert prose-p:text-sm prose-p:leading-relaxed text-slate-300">
                        <p class="font-light">{{ explanation.explanation }}</p>
                    </div>

                    <div
                        class="mt-4 pt-4 border-t border-slate-700/50 flex justify-between items-center text-[10px] text-slate-500 font-mono">
                        <span>ID: {{ requestId }}</span>
                        <span>{{ explanation.timestamp | date:'medium' }}</span>
                    </div>
                </div>

            </div>

            <!-- Decorative Footer Line -->
            <div class="h-0.5 w-full bg-gradient-to-r from-transparent via-cyan-500/50 to-transparent"></div>
        </div>
    </div>
</div>
