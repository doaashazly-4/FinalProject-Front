<nav class="fixed top-0 left-0 right-0 z-50 bg-white transition-all duration-300 py-4 shadow-md"
  [ngClass]="{'py-3': isScrolled, 'bg-white/95': isScrolled, 'backdrop-blur-lg': isScrolled, 'shadow-lg': isScrolled}">

  <div class="flex justify-between items-center max-w-7xl mx-auto px-4 lg:px-8">

    <!-- Logo -->
    <a class="flex items-center gap-3 cursor-pointer group" (click)="goToHome()">
      <div
        class="relative w-12 h-12 flex items-center justify-center overflow-hidden rounded-xl bg-slate-100 transition-transform duration-300 group-hover:scale-110">
        <img src="assets/Images/lynx-logo.png" alt="Lynx Logo" class="w-full h-full object-contain">
      </div>
      <div class="flex flex-col">
        <span class="text-2xl font-black text-slate-900">
          Lynx
        </span>
        <span class="text-xs text-gray-500 font-semibold tracking-wide uppercase hidden sm:block">
          Smart Delivery
        </span>
      </div>
    </a>

    <!-- Mobile Menu Toggle -->
    <button
      class="lg:hidden flex items-center justify-center w-11 h-11 rounded-xl bg-gray-100 text-slate-900 hover:bg-slate-200 transition-all duration-300"
      [ngClass]="{'bg-slate-200': isMenuOpen}" (click)="toggleMenu()">
      <span class="text-xl transition-transform duration-300" [ngClass]="{'rotate-90': isMenuOpen}">☰</span>
    </button>

    <!-- Nav Links -->
    <div class="hidden lg:flex items-center gap-8">
      <a routerLink="/" routerLinkActive="text-slate-900 font-bold" [routerLinkActiveOptions]="{exact: true}"
        class="relative text-gray-600 font-semibold py-2 hover:text-slate-900 transition-all duration-300">
        Home
      </a>
      <a href="#services"
        class="relative text-gray-600 font-semibold py-2 hover:text-slate-900 transition-all duration-300">
        Services
      </a>
      <a href="#how-it-works"
        class="relative text-gray-600 font-semibold py-2 hover:text-slate-900 transition-all duration-300">
        How it Works
      </a>
      <a routerLink="/available-couriers" routerLinkActive="text-slate-900 font-bold"
        class="relative text-gray-600 font-semibold py-2 hover:text-slate-900 transition-all duration-300">
        Couriers
      </a>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3">
      <ng-container *ngIf="!isAuthenticated; else loggedIn">
        <a routerLink="/role-selection"
          class="hidden sm:flex items-center gap-2 px-5 py-2.5 rounded-xl border-2 border-slate-900 text-slate-900 font-semibold hover:bg-slate-100 transition-all duration-300">
          <span>Login</span>
        </a>
        <a routerLink="/role-selection"
          class="sm:hidden flex items-center justify-center w-11 h-11 rounded-xl border-2 border-slate-900 text-slate-900 hover:bg-slate-100 transition-all duration-300">
          <i class="bi bi-person"></i>
        </a>
        <a routerLink="/role-selection"
          class="hidden sm:flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-900 text-white font-semibold hover:bg-slate-800 transition-all duration-300">
          <span>Register Now</span>
        </a>
        <a routerLink="/role-selection"
          class="sm:hidden flex items-center justify-center w-11 h-11 rounded-xl bg-slate-900 text-white transition-all duration-300">
          <i class="bi bi-plus-lg"></i>
        </a>
      </ng-container>

      <ng-template #loggedIn>
        <!-- User Info -->
        <div class="hidden md:flex items-center gap-3 px-4 py-2 bg-slate-100 rounded-xl border border-slate-200">
          <div class="w-9 h-9 rounded-lg bg-slate-900 flex items-center justify-center text-white">
            <i class="bi bi-person"></i>
          </div>
          <div class="flex flex-col">
            <span class="font-bold text-sm text-slate-900">{{ getShortName() }}</span>
            <span class="text-xs text-slate-500 font-semibold">{{ getRoleTitle() }}</span>
          </div>
        </div>

        <!-- Dashboard Button -->
        <a *ngIf="dashboardLink" [routerLink]="dashboardLink"
          class="hidden sm:flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-800 text-white font-semibold shadow-md hover:bg-slate-700 transition-all duration-300">
          <span>Dashboard</span>
        </a>
        <a *ngIf="dashboardLink" [routerLink]="dashboardLink"
          class="sm:hidden flex items-center justify-center w-11 h-11 rounded-xl bg-slate-800 text-white shadow-md hover:bg-slate-700 transition-all duration-300">
          <i class="bi bi-grid-fill"></i>
        </a>

        <!-- Logout Button -->
        <button type="button"
          class="hidden sm:flex items-center gap-2 px-5 py-2.5 rounded-xl bg-red-500 text-white font-semibold shadow-md hover:bg-red-600 transition-all duration-300"
          (click)="logout()">
          <span>Logout</span>
        </button>
        <button type="button"
          class="sm:hidden flex items-center justify-center w-11 h-11 rounded-xl bg-red-500 text-white shadow-md hover:bg-red-600 transition-all duration-300"
          (click)="logout()">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </ng-template>
    </div>
  </div>

  <!-- Mobile Dropdown -->
  <div class="lg:hidden overflow-hidden transition-all duration-300"
    [ngClass]="{'max-h-0 opacity-0': !isMenuOpen, 'max-h-96 opacity-100': isMenuOpen}">
    <div class="flex flex-col gap-2 px-4 py-4 mt-4 border-t border-gray-200">
      <a routerLink="/" routerLinkActive="bg-slate-100 text-slate-900" [routerLinkActiveOptions]="{exact: true}"
        (click)="closeMenu()"
        class="w-full text-center py-3 px-4 rounded-xl text-gray-600 font-semibold bg-gray-50 hover:bg-slate-100 transition-all duration-300">
        Home
      </a>
      <a href="#services" (click)="closeMenu()"
        class="w-full text-center py-3 px-4 rounded-xl text-gray-600 font-semibold bg-gray-50 hover:bg-slate-100 transition-all duration-300">
        Services
      </a>
      <a href="#how-it-works" (click)="closeMenu()"
        class="w-full text-center py-3 px-4 rounded-xl text-gray-600 font-semibold bg-gray-50 hover:bg-slate-100 transition-all duration-300">
        How it Works
      </a>
      <a routerLink="/available-couriers" routerLinkActive="bg-slate-100 text-slate-900" (click)="closeMenu()"
        class="w-full text-center py-3 px-4 rounded-xl text-gray-600 font-semibold bg-gray-50 hover:bg-slate-100 transition-all duration-300">
        Couriers
      </a>
      <a routerLink="/role-selection" routerLinkActive="bg-slate-100 text-slate-900" (click)="closeMenu()"
        class="w-full text-center py-3 px-4 rounded-xl text-gray-600 font-semibold bg-gray-50 hover:bg-slate-100 transition-all duration-300">
        Register
      </a>
      <a routerLink="/role-selection" routerLinkActive="bg-slate-100 text-slate-900" (click)="closeMenu()"
        class="w-full text-center py-3 px-4 rounded-xl text-gray-600 font-semibold bg-gray-50 hover:bg-slate-100 transition-all duration-300">
        Login
      </a>
    </div>
  </div>
</nav>
