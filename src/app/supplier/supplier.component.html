<div class="grid grid-cols-1 lg:grid-cols-[280px_1fr] min-h-screen bg-gray-50Selection:bg-slate-200" dir="ltr">
  <!-- Desktop Sidebar -->
  <aside class="hidden lg:block bg-slate-900 text-slate-200 p-6 sticky top-0 self-start min-h-screen shadow-xl">
    <div class="flex items-center gap-4 mb-8">
      <div class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center shadow-lg overflow-hidden p-1">
        <img src="assets/Images/lynx-logo.png" alt="Lynx" class="w-full h-full object-contain">
      </div>
      <div>
        <span class="font-black text-white text-xl block">Lynx</span>
        <small class="text-slate-400 font-semibold">{{ userName }}</small>
      </div>
    </div>

    <!-- Role Badge -->
    <div class="mb-6 px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl">
      <span class="text-slate-200 text-sm font-bold uppercase tracking-wider">
        <i class="bi bi-person-badge mr-2"></i>
        Supplier Account
      </span>
      <p *ngIf="businessName" class="text-slate-500 text-xs mt-1">{{ businessName }}</p>
    </div>

    <!-- Action Button -->
    <a routerLink="/supplier/create-shipment"
      class="flex items-center justify-center gap-2 w-full py-3 mb-6 bg-white text-slate-900 font-bold rounded-xl shadow-lg hover:-translate-y-0.5 transition-all duration-300">
      <i class="bi bi-plus-lg"></i>
      <span>New Shipment</span>
    </a>

    <nav class="flex flex-col gap-2">
      <a *ngFor="let item of navItems" [routerLink]="item.path"
        routerLinkActive="bg-white/10 text-white border border-white/10"
        class="flex items-center justify-between px-4 py-3 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition-all duration-200">
        <div class="flex items-center gap-3">
          <i class="bi text-lg" [ngClass]="item.icon"></i>
          <span>{{ item.label }}</span>
        </div>
        <span *ngIf="item.badge && item.badge > 0"
          class="px-2 py-0.5 bg-slate-700 text-white text-xs font-bold rounded-full min-w-[20px] text-center">
          {{ item.badge }}
        </span>
      </a>
    </nav>

    <div class="mt-8 pt-6 border-t border-white/10 space-y-3">
      <a routerLink="/home"
        class="flex items-center gap-2 text-slate-500 hover:text-white transition-colors duration-200">
        <i class="bi bi-arrow-left"></i>
        Back to Home
      </a>
      <button (click)="logout()"
        class="flex items-center gap-2 text-red-500 hover:text-red-400 transition-colors duration-200 w-full text-left">
        <i class="bi bi-box-arrow-right"></i>
        Logout
      </button>
    </div>

    <!-- Help Box -->
    <div class="mt-8 p-4 bg-white/5 rounded-xl border border-white/10">
      <div class="flex items-center gap-3 mb-3">
        <i class="bi bi-question-circle text-slate-400"></i>
        <span class="text-white font-semibold text-sm">Need Help?</span>
      </div>
      <p class="text-slate-500 text-xs mb-3">Support team is available 24/7</p>
      <button
        class="w-full py-2 bg-white/5 text-white text-sm font-semibold rounded-lg hover:bg-white/10 transition-colors">
        Contact Us
      </button>
    </div>
  </aside>

  <!-- Mobile Header -->
  <div class="lg:hidden fixed top-0 left-0 right-0 z-50 bg-slate-900 shadow-lg">
    <div class="flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center overflow-hidden p-1 shadow-md">
          <img src="assets/Images/lynx-logo.png" alt="Lynx" class="w-full h-full object-contain">
        </div>
        <div>
          <span class="font-bold text-white text-sm block">Lynx</span>
          <small class="text-slate-400 text-xs">Supplier Portal</small>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a routerLink="/supplier/create-shipment"
          class="w-10 h-10 rounded-xl bg-white text-slate-900 flex items-center justify-center">
          <i class="bi bi-plus-lg"></i>
        </a>
        <button (click)="toggleMobileMenu()"
          class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-white">
          <i class="bi text-xl" [ngClass]="isMobileMenuOpen ? 'bi-x-lg' : 'bi-list'"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="lg:hidden fixed inset-0 z-40 transition-all duration-300"
    [ngClass]="{'pointer-events-none opacity-0': !isMobileMenuOpen, 'pointer-events-auto opacity-100': isMobileMenuOpen}">
    <div class="absolute inset-0 bg-black/60" (click)="closeMobileMenu()"></div>

    <div
      class="absolute left-0 top-0 h-full w-72 bg-slate-900 p-5 transform transition-transform duration-300 shadow-2xl"
      [ngClass]="{'-translate-x-full': !isMobileMenuOpen, 'translate-x-0': isMobileMenuOpen}">

      <div class="flex items-center gap-3 mb-6 pb-4 border-b border-white/10">
        <div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center p-1 overflow-hidden">
          <img src="assets/Images/lynx-logo.png" alt="Lynx" class="w-full h-full object-contain">
        </div>
        <div>
          <span class="font-bold text-white block">{{ userName }}</span>
          <small class="text-slate-400 text-sm">Supplier Account</small>
        </div>
      </div>

      <nav class="flex flex-col gap-2">
        <a *ngFor="let item of navItems" [routerLink]="item.path"
          routerLinkActive="bg-white/10 text-white border border-white/10" (click)="closeMobileMenu()"
          class="flex items-center justify-between px-4 py-3 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition-all duration-200">
          <div class="flex items-center gap-3">
            <i class="bi" [ngClass]="item.icon"></i>
            <span>{{ item.label }}</span>
          </div>
          <span *ngIf="item.badge && item.badge > 0"
            class="px-2 py-0.5 bg-slate-700 text-white text-xs font-bold rounded-full">
            {{ item.badge }}
          </span>
        </a>
      </nav>

      <div class="mt-6 pt-4 border-t border-white/10 space-y-3">
        <a routerLink="/home" (click)="closeMobileMenu()"
          class="flex items-center gap-2 text-slate-500 hover:text-white transition-colors">
          <i class="bi bi-house"></i>
          <span>Back to Home</span>
        </a>
        <button (click)="logout()"
          class="flex items-center gap-2 text-red-500 hover:text-red-400 transition-colors w-full text-left">
          <i class="bi bi-box-arrow-right"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="p-4 lg:p-8 pt-20 lg:pt-8 bg-white">
    <router-outlet></router-outlet>
  </main>
</div>
