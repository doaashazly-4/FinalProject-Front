<div class="min-h-screen relative overflow-hidden flex items-center justify-center bg-gradient-to-br from-[#ebf5f0] via-[#ddece5] to-[#c8e4d8] py-6 px-4 sm:px-6 lg:px-8">
  
  <!-- Animated Background Canvas -->
  <app-particle-background class="absolute inset-0 z-0"></app-particle-background>

  <div class="w-full max-w-6xl z-10 grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-0 glass-effect rounded-3xl overflow-hidden shadow-2xl animate-fade-in-up">
    
    <!-- Right Side: Content (Roles) -->
    <div class="p-8 lg:p-12 xl:p-16 flex flex-col justify-center">
      
      <div class="mb-10 text-center lg:text-right">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-600 text-white text-3xl mb-6 shadow-lg shadow-emerald-500/30">
          🎭
        </div>
        <h2 class="text-3xl lg:text-4xl font-extrabold text-gray-900 tracking-tight">اختر نوع الحساب</h2>
        <p class="mt-3 text-lg text-gray-500">الرجاء تحديد صفتك للدخول إلى النظام</p>
      </div>

      <div class="grid grid-cols-1 gap-5">
        
        <!-- Client Option -->
        <button (click)="navigateToRoleLogin('client')"
          class="group relative flex items-center gap-6 p-5 rounded-2xl border-2 border-white/50 bg-white/40 hover:bg-white/80 hover:border-emerald-500 transition-all duration-300 text-right shadow-sm hover:shadow-lg hover:-translate-y-1">
          <div class="w-16 h-16 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center text-3xl shadow-inner group-hover:scale-110 transition-transform duration-300">
            👤
          </div>
          <div>
            <h3 class="text-xl font-bold text-gray-800 group-hover:text-emerald-700 transition-colors">عميل</h3>
            <p class="text-sm text-gray-500 font-medium">تتبع شحناتك وإدارة طلباتك بسهولة</p>
          </div>
          <div class="absolute left-5 text-gray-300 group-hover:text-emerald-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
          </div>
        </button>

        <!-- Supplier Option -->
        <button (click)="navigateToRoleLogin('supplier')"
          class="group relative flex items-center gap-6 p-5 rounded-2xl border-2 border-white/50 bg-white/40 hover:bg-white/80 hover:border-emerald-500 transition-all duration-300 text-right shadow-sm hover:shadow-lg hover:-translate-y-1">
          <div class="w-16 h-16 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl shadow-inner group-hover:scale-110 transition-transform duration-300">
            🏭
          </div>
          <div>
            <h3 class="text-xl font-bold text-gray-800 group-hover:text-emerald-700 transition-colors">مُرسل</h3>
            <p class="text-sm text-gray-500 font-medium">إدارة الشحنات والعمليات اللوجستية</p>
          </div>
          <div class="absolute left-5 text-gray-300 group-hover:text-emerald-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
          </div>
        </button>

        <!-- Courier Option -->
        <button (click)="navigateToRoleLogin('courier')"
          class="group relative flex items-center gap-6 p-5 rounded-2xl border-2 border-white/50 bg-white/40 hover:bg-white/80 hover:border-orange-500 transition-all duration-300 text-right shadow-sm hover:shadow-lg hover:-translate-y-1">
          <div class="w-16 h-16 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center text-3xl shadow-inner group-hover:scale-110 transition-transform duration-300">
            🚚
          </div>
          <div>
            <h3 class="text-xl font-bold text-gray-800 group-hover:text-orange-700 transition-colors">مندوب توصيل</h3>
            <p class="text-sm text-gray-500 font-medium">توصيل الطلبات وإدارة الجدول</p>
          </div>
          <div class="absolute left-5 text-gray-300 group-hover:text-orange-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
          </div>
        </button>

      </div>

      <div class="mt-8 text-center">
        <p class="text-gray-600 font-medium">ليس لديك حساب؟ <a (click)="goToRegister()" class="text-emerald-600 font-bold hover:underline cursor-pointer">أنشئ حساباً جديداً</a></p>
      </div>

    </div>

    <!-- Left Side: Branding (Same as Login) -->
    <div class="hidden lg:flex flex-col justify-center items-center relative bg-gradient-to-br from-emerald-500 to-teal-600 p-12 overflow-hidden text-white">
      <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
      <div class="absolute bottom-0 left-0 w-80 h-80 bg-black/10 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2"></div>
      
      <div class="relative z-10 text-center max-w-sm">
        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-6 mb-8 border border-white/20 shadow-xl animate-float">
          <img src="assets/Images/lynx-logo.png" alt="Logo" class="w-full drop-shadow-lg opacity-95">
        </div>
        <h3 class="text-3xl font-bold mb-4">بوابة الخدمات اللوجستية</h3>
        <p class="text-emerald-50 text-lg leading-relaxed mb-8">
          اختر بوابتك المناسبة للدخول إلى عالم من الخدمات المتكاملة والسرعة الفائقة.
        </p>
      </div>
    </div>

  </div>
</div>
