<div
  class="min-h-screen relative overflow-hidden flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8">

  <!-- Subtle Background Decor -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-0 right-10 w-96 h-96 bg-brand-500/5 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-0 left-10 w-96 h-96 bg-success-500/5 rounded-full blur-[100px]"></div>
    <app-particle-background class="absolute inset-0 z-0 opacity-40"></app-particle-background>
  </div>

  <div class="w-full max-w-5xl z-10">
    <!-- Header Section -->
    <div class="text-center mb-16 animate-fade-in">
      <div
        class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-slate-900 shadow-premium mb-8 group overflow-hidden transition-all duration-500 hover:rotate-6">
        <img src="assets/Images/lynx-logo.png" alt="Lynx" class="w-12 h-12 brightness-0 invert opacity-90">
      </div>
      <h1 class="text-4xl font-black text-slate-900 tracking-tight mb-4">بوابة الخدمات اللوجستية</h1>
      <p class="text-slate-500 text-lg">اختر نوع حسابك للمتابعة</p>
    </div>

    <!-- Roles Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 px-4">

      <!-- Receiver (Customer/Client) -->
      <button (click)="navigateToRoleLogin('client')"
        class="group relative flex flex-col items-center justify-between p-10 bg-white rounded-[2.5rem] border border-slate-100 shadow-soft transition-all duration-500 hover:shadow-premium hover:-translate-y-2 text-center overflow-hidden">
        <!-- Abstract Decoration -->
        <div
          class="absolute -top-12 -right-12 w-32 h-32 bg-brand-50 rounded-full group-hover:scale-150 transition-transform duration-700">
        </div>

        <div
          class="relative z-10 w-24 h-24 rounded-3xl bg-brand-50 text-brand-600 flex items-center justify-center shadow-soft mb-8 transition-all duration-500 group-hover:bg-brand-500 group-hover:text-white">
          <lucide-icon name="user" class="w-10 h-10"></lucide-icon>
        </div>

        <div class="relative z-10">
          <h3 class="text-2xl font-black text-slate-900 mb-3 tracking-tight">مُستلم</h3>
          <p class="text-slate-500 text-sm leading-relaxed mb-8">تلقي الطلبات، تتبع الشحنات، وإدارة العناوين الخاصة بك.
          </p>
        </div>

        <div
          class="relative z-10 flex items-center gap-2 text-brand-600 font-bold group-hover:gap-4 transition-all uppercase tracking-widest text-xs">
          <span>دخول</span>
          <lucide-icon name="arrow-left" class="w-4 h-4"></lucide-icon>
        </div>
      </button>

      <!-- Sender (Supplier) -->
      <button (click)="navigateToRoleLogin('supplier')"
        class="group relative flex flex-col items-center justify-between p-10 bg-white rounded-[2.5rem] border border-slate-100 shadow-soft transition-all duration-500 hover:shadow-premium hover:-translate-y-2 text-center overflow-hidden active:scale-95">
        <!-- Abstract Decoration -->
        <div
          class="absolute -top-12 -right-12 w-32 h-32 bg-success-50 rounded-full group-hover:scale-150 transition-transform duration-700">
        </div>

        <div
          class="relative z-10 w-24 h-24 rounded-3xl bg-success-50 text-success-600 flex items-center justify-center shadow-soft mb-8 transition-all duration-500 group-hover:bg-success-500 group-hover:text-white">
          <lucide-icon name="package" class="w-10 h-10"></lucide-icon>
        </div>

        <div class="relative z-10">
          <h3 class="text-2xl font-black text-slate-900 mb-3 tracking-tight">مُرسل</h3>
          <p class="text-slate-500 text-sm leading-relaxed mb-8">إرسال الشحنات، تتبع المخزون، وإدارة الطلبات الصادرة.
          </p>
        </div>

        <div
          class="relative z-10 flex items-center gap-2 text-success-600 font-bold group-hover:gap-4 transition-all uppercase tracking-widest text-xs">
          <span>دخول</span>
          <lucide-icon name="arrow-left" class="w-4 h-4"></lucide-icon>
        </div>
      </button>

      <!-- Carrier (Courier) -->
      <button (click)="navigateToRoleLogin('courier')"
        class="group relative flex flex-col items-center justify-between p-10 bg-white rounded-[2.5rem] border border-slate-100 shadow-soft transition-all duration-500 hover:shadow-premium hover:-translate-y-2 text-center overflow-hidden">
        <!-- Abstract Decoration -->
        <div
          class="absolute -top-12 -right-12 w-32 h-32 bg-slate-100 rounded-full group-hover:scale-150 transition-transform duration-700">
        </div>

        <div
          class="relative z-10 w-24 h-24 rounded-3xl bg-slate-50 text-slate-600 flex items-center justify-center shadow-soft mb-8 transition-all duration-500 group-hover:bg-slate-900 group-hover:text-white">
          <lucide-icon name="truck" class="w-10 h-10"></lucide-icon>
        </div>

        <div class="relative z-10">
          <h3 class="text-2xl font-black text-slate-900 mb-3 tracking-tight">مندوب</h3>
          <p class="text-slate-500 text-sm leading-relaxed mb-8">توصيل الطلبات، إدارة الطرق، وتحقيق الأرباح من التوصيل.
          </p>
        </div>

        <div
          class="relative z-10 flex items-center gap-2 text-slate-900 font-bold group-hover:gap-4 transition-all uppercase tracking-widest text-xs">
          <span>دخول</span>
          <lucide-icon name="arrow-left" class="w-4 h-4"></lucide-icon>
        </div>
      </button>

    </div>

    <!-- Footer Action -->
    <div class="mt-16 text-center">
      <p class="text-slate-500 font-medium">
        ليس لديك حساب؟
        <button (click)="goToRegister()"
          class="text-slate-900 font-black hover:text-brand-600 transition-colors ml-1 px-2 py-1 bg-white rounded-lg shadow-soft border border-slate-100">
          إنشاء حساب جديد
        </button>
      </p>
    </div>
  </div>
</div>
