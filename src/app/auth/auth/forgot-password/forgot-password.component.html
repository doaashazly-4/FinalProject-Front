<div class="min-h-screen relative overflow-hidden flex items-center justify-center bg-gradient-to-br from-[#ebf5f0] via-[#ddece5] to-[#c8e4d8] py-6 px-4 sm:px-6 lg:px-8">
  
  <!-- Animated Background Canvas -->
  <app-particle-background class="absolute inset-0 z-0"></app-particle-background>

  <div class="w-full max-w-6xl z-10 grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-0 glass-effect rounded-3xl overflow-hidden shadow-2xl animate-fade-in-up">
    
    <!-- Left Side: Form -->
    <div class="p-8 lg:p-12 xl:p-16 flex flex-col justify-center">
      
      <div class="mb-10 text-center lg:text-right">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-600 text-white text-3xl mb-6 shadow-lg shadow-emerald-500/30">
          📧
        </div>
        <h2 class="text-3xl lg:text-4xl font-extrabold text-gray-900 tracking-tight">نسيت كلمة المرور؟</h2>
        <p class="mt-3 text-lg text-gray-500">لا تقلق! أدخل بريدك الإلكتروني وسنرسل لك تعليمات استعادة كلمة المرور.</p>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50/80 backdrop-blur-sm border border-red-200 rounded-xl flex items-start gap-3 animate-fade-in-up">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-sm text-red-700 font-medium pt-0.5">{{ errorMessage }}</span>
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="mb-6 p-4 bg-emerald-50/80 backdrop-blur-sm border border-emerald-200 rounded-xl flex items-start gap-3 animate-fade-in-up">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-emerald-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-sm text-emerald-700 font-medium pt-0.5">{{ successMessage }}</span>
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">البريد الإلكتروني</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <input type="email" formControlName="email" placeholder="example@domain.com"
              class="w-full pr-11 pl-4 py-3.5 rounded-xl glass-input text-gray-900 placeholder-gray-400 focus:outline-none transition-all duration-300"
              [class.border-red-300]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
          </div>
          <div *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid" class="mt-1 text-xs text-red-500 font-medium">
             البريد الإلكتروني مطلوب وغير صالح
          </div>
        </div>

        <button type="submit" [disabled]="forgotPasswordForm.invalid || isLoading"
          class="w-full py-4 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-lg shadow-lg shadow-emerald-500/30 hover:shadow-emerald-500/40 hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none transition-all duration-300 flex items-center justify-center gap-3 mt-6">
          <span *ngIf="isLoading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          <span>{{ isLoading ? 'جاري الإرسال...' : 'إرسال رابط الاستعادة' }}</span>
        </button>

        <div class="pt-6 mt-6 border-t border-gray-100 text-center">
          <a (click)="goBack()" class="font-bold text-emerald-600 hover:text-emerald-700 hover:underline cursor-pointer flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
            <span>العودة لتسجيل الدخول</span>
          </a>
        </div>
      </form>
    </div>

    <!-- Right Side: Branding -->
    <div class="hidden lg:flex flex-col justify-center items-center relative bg-gradient-to-br from-emerald-500 to-teal-600 p-12 overflow-hidden text-white">
      <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
      <div class="absolute bottom-0 left-0 w-80 h-80 bg-black/10 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2"></div>
      
      <div class="relative z-10 text-center max-w-sm">
        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-6 mb-8 border border-white/20 shadow-xl animate-float">
          <img src="assets/Images/lynx-logo.png" alt="Logo" class="w-full drop-shadow-lg opacity-95">
        </div>
        <h3 class="text-3xl font-bold mb-4">استعادة الوصول</h3>
        <p class="text-emerald-50 text-lg leading-relaxed mb-8">
          سنساعدك في استعادة حسابك بسرعة وأمان.
        </p>
      </div>
    </div>
  </div>
</div>
