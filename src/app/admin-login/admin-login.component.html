<div class="min-h-screen relative overflow-hidden flex items-center justify-center bg-gradient-to-br from-[#ebf5f0] via-[#ddece5] to-[#c8e4d8] py-6 px-4 sm:px-6 lg:px-8">
  
  <!-- Animated Background Canvas -->
  <app-particle-background class="absolute inset-0 z-0"></app-particle-background>

  <div class="w-full max-w-6xl z-10 grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-0 glass-effect rounded-3xl overflow-hidden shadow-2xl animate-fade-in-up">
    
    <!-- Left Side: Form -->
    <div class="p-8 lg:p-12 xl:p-16 flex flex-col justify-center">
      
      <div class="mb-10 text-center lg:text-right">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-600 text-white text-3xl mb-6 shadow-lg shadow-emerald-500/30">
          🛡️
        </div>
        <h2 class="text-3xl lg:text-4xl font-extrabold text-gray-900 tracking-tight">تسجيل دخول المسؤول</h2>
        <p class="mt-3 text-lg text-gray-500">مرحباً بك في لوحة تحكم النظام</p>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50/80 backdrop-blur-sm border border-red-200 rounded-xl flex items-start gap-3 animate-fade-in-up">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-sm text-red-700 font-medium pt-0.5">{{ errorMessage }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" class="space-y-6">
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">اسم المستخدم</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <input type="text" formControlName="userName" placeholder="AdminUser"
              class="w-full pr-11 pl-4 py-3.5 rounded-xl glass-input text-gray-900 placeholder-gray-400 focus:outline-none transition-all duration-300"
              [class.border-red-300]="loginForm.get('userName')?.invalid && loginForm.get('userName')?.touched">
          </div>
          <div *ngIf="loginForm.get('userName')?.touched && loginForm.get('userName')?.invalid" class="mt-1 text-xs text-red-500 font-medium">
            اسم المستخدم مطلوب
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">كلمة المرور</label>
          <div class="relative">
            <input [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="••••••••"
              class="w-full pr-11 pl-12 py-3.5 rounded-xl glass-input text-gray-900 placeholder-gray-400 focus:outline-none transition-all duration-300"
              [class.border-red-300]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            
            <button type="button" (click)="hidePassword = !hidePassword" class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400 hover:text-emerald-600 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path *ngIf="hidePassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path *ngIf="hidePassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                <path *ngIf="!hidePassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
          </div>
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="mt-1 text-xs text-red-500 font-medium">
            كلمة المرور مطلوبة
          </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid || isLoading"
          class="w-full py-4 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-lg shadow-lg shadow-emerald-500/30 hover:shadow-emerald-500/40 hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none transition-all duration-300 flex items-center justify-center gap-3 mt-6">
          <span *ngIf="isLoading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          <span>{{ isLoading ? 'جاري التحقق...' : 'دخول' }}</span>
        </button>

      </form>
    </div>

    <!-- Right Side: Branding -->
    <div class="hidden lg:flex flex-col justify-center items-center relative bg-gradient-to-br from-emerald-500 to-teal-600 p-12 overflow-hidden text-white">
      <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
      <div class="absolute bottom-0 left-0 w-80 h-80 bg-black/10 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2"></div>
      
      <div class="relative z-10 text-center max-w-sm">
        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-6 mb-8 border border-white/20 shadow-xl animate-float">
          <img src="assets/Images/lynx-logo.png" alt="Logo" class="w-full drop-shadow-lg opacity-95">
        </div>
        <h3 class="text-3xl font-bold mb-4">بوابة الإدارة</h3>
        <p class="text-emerald-50 text-lg leading-relaxed mb-8">
          إدارة النظام، المستخدمين، والعمليات بكفاءة عالية.
        </p>
      </div>
    </div>

  </div>
</div>
