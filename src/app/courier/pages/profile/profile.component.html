<div class="container mx-auto p-4 md:p-6 max-w-5xl" dir="rtl">

    <div *ngIf="isLoading && !profile" class="flex justify-center items-center h-64">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
    </div>

    <div *ngIf="profile" class="bg-white rounded-3xl shadow-xl overflow-hidden transition-all duration-300">

        <!-- Header Cover -->
        <div class="h-40 bg-gradient-to-r from-blue-600 to-indigo-700 relative">
            <div class="absolute inset-0 bg-black opacity-10 pattern-grid-lg"></div>
        </div>

        <div class="px-6 md:px-10 pb-10">

            <!-- Profile Header -->
            <div class="relative flex flex-col items-center -mt-20 mb-8">
                <!-- Avatar -->
                <div class="relative group">
                    <div class="w-40 h-40 rounded-full border-4 border-white shadow-2xl overflow-hidden bg-gray-200">
                        <img [src]="photoPreview || getImageUrl(profile.photoUrl)" class="w-full h-full object-cover"
                            alt="الصورة الشخصية" (error)="handleImageError($event)">
                    </div>

                    <!-- Edit Overlay (Only in Edit Mode) -->
                    <label *ngIf="isEditing"
                        class="absolute inset-0 bg-black bg-opacity-40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 cursor-pointer transition-opacity duration-200">
                        <input type="file" (change)="onFileSelected($event, 'photo')" accept="image/*" class="hidden">
                        <span
                            class="text-white font-medium text-sm bg-black bg-opacity-50 px-3 py-1 rounded-full">تغيير</span>
                    </label>
                </div>

                <h1 class="text-3xl font-bold text-gray-900 mt-4">{{ profile.name }}</h1>
                <p class="text-gray-500 font-medium">{{ profile.email }}</p>

                <div class="flex gap-4 mt-3">
                    <div
                        class="flex items-center gap-1 px-3 py-1 bg-yellow-50 text-yellow-700 rounded-full border border-yellow-100">
                        <svg class="w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                            <path
                                d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                        </svg>
                        <span class="font-bold">{{ profile.rating }}</span>
                    </div>
                    <div
                        class="flex items-center gap-1 px-3 py-1 bg-blue-50 text-blue-700 rounded-full border border-blue-100">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        <span class="font-bold">{{ profile.completedDeliveries }} توصيل</span>
                    </div>
                </div>
            </div>

            <hr class="border-gray-100 mb-8">

            <form [formGroup]="profileForm" (ngSubmit)="saveChanges()">

                <!-- Status Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100 flex items-center justify-between">
                        <div>
                            <h3 class="font-semibold text-gray-900">الحالة (متاح)</h3>
                            <p class="text-sm text-gray-500">هل أنت مستعد لاستقبال طلبات جديدة؟</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" formControlName="isAvailable" class="sr-only peer">
                            <div
                                class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-100 rounded-full peer peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600">
                            </div>
                        </label>
                    </div>

                    <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100 flex items-center justify-between">
                        <div>
                            <h3 class="font-semibold text-gray-900">حالة الاتصال</h3>
                            <p class="text-sm text-gray-500">الظهور على الخريطة</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" formControlName="isOnline" class="sr-only peer">
                            <div
                                class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-100 rounded-full peer peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500">
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Personal Information -->
                <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    البيانات الشخصية
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                    <div class="form-group">
                        <label class="block text-sm font-medium text-gray-700 mb-2">رقم الهاتف</label>
                        <input type="text" formControlName="phone"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all disabled:bg-gray-50 disabled:text-gray-500 text-right">
                    </div>

                    <div class="form-group">
                        <label class="block text-sm font-medium text-gray-700 mb-2">العنوان</label>
                        <input type="text" formControlName="address"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all disabled:bg-gray-50 disabled:text-gray-500 text-right">
                    </div>
                </div>

                <!-- Vehicle & License -->
                <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                    المركبة والرخصة
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                    <div class="form-group">
                        <label class="block text-sm font-medium text-gray-700 mb-2">نوع المركبة</label>
                        <!-- Select only in edit mode, or text -->
                        <div *ngIf="!isEditing"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-500 text-right">
                            {{ getVehicleTypeLabel(profile.vehicleType) }}
                        </div>
                        <select *ngIf="isEditing" formControlName="vehicleType"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all text-right">
                            <option value="Car">سيارة</option>
                            <option value="Bike">دراجة نارية</option>
                            <option value="Van">شاحنة صغيرة (Van)</option>
                            <option value="Scooter">سكوتر</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="block text-sm font-medium text-gray-700 mb-2">رقم الرخصة</label>
                        <input type="text" formControlName="licenseNumber"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all disabled:bg-gray-50 disabled:text-gray-500 text-right">
                    </div>
                </div>

                <!-- Documents Section -->
                <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                        </path>
                    </svg>
                    المستندات والصور
                </h3>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

                    <!-- Image Card Helper -->
                    <ng-template #imageCard let-title="title" let-preview="preview" let-url="url" let-control="control">
                        <div class="border rounded-xl p-4 bg-gray-50 hover:bg-white hover:shadow-md transition-all">
                            <h4 class="text-sm font-semibold text-gray-700 mb-3">{{title}}</h4>
                            <div
                                class="relative aspect-video bg-gray-200 rounded-lg overflow-hidden border border-gray-200 group">
                                <img [src]="preview || getImageUrl(url)" class="w-full h-full object-cover"
                                    (error)="handleImageError($event)">

                                <label *ngIf="isEditing"
                                    class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center opacity-0 group-hover:opacity-100 cursor-pointer transition-opacity">
                                    <input type="file" (change)="onFileSelected($event, control)" accept="image/*"
                                        class="hidden">
                                    <span
                                        class="bg-white text-gray-800 px-3 py-1.5 rounded-lg text-sm font-medium shadow-sm hover:bg-gray-100">رفع
                                        صورة</span>
                                </label>
                            </div>
                        </div>
                    </ng-template>

                    <ng-container
                        *ngTemplateOutlet="imageCard; context: {title: 'صورة الرخصة (أمام)', preview: licenseFrontPreview, url: profile.licensePhotoFront, control: 'licensePhotoFront'}"></ng-container>
                    <ng-container
                        *ngTemplateOutlet="imageCard; context: {title: 'صورة الرخصة (خلف)', preview: licenseBackPreview, url: profile.licensePhotoBack, control: 'licensePhotoBack'}"></ng-container>
                    <ng-container
                        *ngTemplateOutlet="imageCard; context: {title: 'رخصة المركبة (أمام)', preview: vehicleLicenseFrontPreview, url: profile.vehicleLicensePhotoFront, control: 'vehicleLicensePhotoFront'}"></ng-container>
                    <ng-container
                        *ngTemplateOutlet="imageCard; context: {title: 'رخصة المركبة (خلف)', preview: vehicleLicenseBackPreview, url: profile.vehicleLicensePhotoBack, control: 'vehicleLicensePhotoBack'}"></ng-container>
                    <ng-container
                        *ngTemplateOutlet="imageCard; context: {title: 'صورة الهوية', preview: idPhotoPreview, url: profile.idPhotoUrl, control: 'idPhoto'}"></ng-container>

                </div>

                <!-- Footer Actions -->
                <div class="mt-12 flex items-center justify-end gap-4 border-t pt-6">
                    <ng-container *ngIf="!isEditing">
                        <button type="button" (click)="toggleEdit()"
                            class="px-6 py-3 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 shadow-xl shadow-blue-200 transition-all flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z">
                                </path>
                            </svg>
                            تعديل الملف
                        </button>
                    </ng-container>

                    <ng-container *ngIf="isEditing">
                        <button type="button" (click)="cancelEdit()"
                            class="px-6 py-3 text-gray-600 font-semibold hover:bg-gray-100 rounded-xl transition-all">
                            إلغاء
                        </button>
                        <button type="submit" [disabled]="isLoading"
                            class="px-8 py-3 bg-green-600 text-white rounded-xl font-semibold hover:bg-green-700 shadow-xl shadow-green-200 transition-all flex items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
                            <span *ngIf="isLoading"
                                class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                            حفظ التغييرات
                        </button>
                    </ng-container>
                </div>

            </form>
        </div>
    </div>
</div>
