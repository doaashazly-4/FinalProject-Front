<div *ngIf="isVisible" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">

  <div class="bg-white rounded-2xl w-full max-w-md p-6 space-y-4">

    <h2 class="text-xl font-black text-center">
      تأكيد التسليم
    </h2>

    <!-- OTP Input -->
    <div>
      <label class="block text-sm font-medium mb-1">
        رمز OTP
      </label>
      <input type="text" [(ngModel)]="otp" maxlength="6"
        class="w-full px-4 py-3 border rounded-xl text-center text-lg tracking-widest" placeholder="••••"
        [ngClass]="{'border-red-500 bg-red-50': error}">

      <!-- Inline Error -->
      <p *ngIf="error" class="text-red-500 text-sm font-bold text-center mt-2 animate-pulse">
        {{ error }}
      </p>

      <!-- DEMO ONLY: Show OTP Hint -->
      <div *ngIf="expectedOtp" class="mt-2 text-center flex items-center justify-center gap-2">
        <span class="text-xs text-gray-400 uppercase font-bold tracking-wider">Demo Tip</span>
        <div
          class="inline-block px-2 py-0.5 bg-yellow-100 text-yellow-800 rounded font-mono text-sm border border-yellow-200">
          Code: {{ expectedOtp }}
        </div>
        <button (click)="refresh()" class="text-xs text-blue-500 hover:text-blue-700 underline">
          Refresh
        </button>
      </div>
    </div>

    <!-- Notes -->
    <div>
      <label class="block text-sm font-medium mb-1">
        ملاحظات (اختياري)
      </label>
      <textarea [(ngModel)]="notes" rows="3" class="w-full px-4 py-2 border rounded-xl"
        placeholder="ملاحظات إضافية"></textarea>
    </div>

    <!-- Error -->

    <!-- Actions -->
    <div class="flex gap-3 pt-2">
      <button (click)="cancel()" class="flex-1 py-3 bg-gray-200 rounded-xl font-bold">
        إلغاء
      </button>

      <button (click)="submit()" [disabled]="isSubmitting"
        class="flex-1 py-3 bg-green-600 text-white rounded-xl font-bold">
        تأكيد التسليم
      </button>
    </div>

  </div>
</div>
