<div *ngIf="isVisible" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">

  <div class="bg-white rounded-2xl w-full max-w-md p-6 space-y-4">

    <h2 class="text-xl font-black text-center">
      تأكيد التسليم
    </h2>

    <!-- OTP Input -->
    <div>
      <label class="block text-sm font-medium mb-1">
        رمز OTP
      </label>
      <input type="text" [(ngModel)]="otp" maxlength="6"
        class="w-full px-4 py-3 border rounded-xl text-center text-lg tracking-widest" placeholder="••••">
    </div>

    <!-- Notes -->
    <div>
      <label class="block text-sm font-medium mb-1">
        ملاحظات (اختياري)
      </label>
      <textarea [(ngModel)]="notes" rows="3" class="w-full px-4 py-2 border rounded-xl"
        placeholder="ملاحظات إضافية"></textarea>
    </div>

    <!-- Error -->
    <div *ngIf="error" class="p-3 bg-red-100 text-red-700 rounded-xl text-sm">
      {{ error }}
    </div>

    <!-- Actions -->
    <div class="flex gap-3 pt-2">
      <button (click)="cancel()" class="flex-1 py-3 bg-gray-200 rounded-xl font-bold">
        إلغاء
      </button>

      <button (click)="submit()" [disabled]="isSubmitting"
        class="flex-1 py-3 bg-green-600 text-white rounded-xl font-bold">
        تأكيد التسليم
      </button>
    </div>

  </div>
</div>
