<div class="grid grid-cols-1 lg:grid-cols-[300px_1fr] min-h-screen bg-slate-50">

  <!-- Desktop Sidebar -->
  <aside
    class="hidden lg:flex flex-col bg-slate-900 text-slate-400 p-8 sticky top-0 self-start h-screen overflow-y-auto custom-scrollbar border-l border-slate-800">
    <!-- Brand Header -->
    <div class="flex items-center gap-4 mb-12">
      <div
        class="w-12 h-12 rounded-2xl bg-white flex items-center justify-center shadow-premium p-2 overflow-hidden shrink-0">
        <img src="assets/Images/lynx-logo.png" alt="Lynx" class="w-full h-full object-contain">
      </div>
      <div class="min-w-0">
        <span class="font-black text-white text-xl block tracking-tight">Lynx</span>
        <div class="flex items-center gap-1.5 mt-0.5">
          <div class="w-1.5 h-1.5 rounded-full bg-success-500 animate-pulse"></div>
          <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest truncate">نشط • {{ userName
            }}</span>
        </div>
      </div>
    </div>

    <!-- Nav section header -->
    <div class="px-2 mb-4">
      <span class="text-[10px] font-black text-slate-600 uppercase tracking-[0.2em]">بوابة المندوب</span>
    </div>

    <!-- Navigation -->
    <nav class="flex flex-col gap-1 flex-1">
      <a *ngFor="let item of navItems" [routerLink]="item.path" routerLinkActive="bg-white/5 text-white shadow-soft"
        class="flex items-center justify-between px-4 py-3.5 rounded-xl transition-all duration-300 group hover:bg-white/5 hover:text-white">
        <div class="flex items-center gap-3">
          <lucide-icon [name]="item.icon"
            class="w-5 h-5 opacity-60 group-hover:opacity-100 transition-opacity"></lucide-icon>
          <span class="text-sm font-bold">{{ item.label }}</span>
        </div>
      </a>
    </nav>

    <!-- Sidebar Footer -->
    <div class="mt-8 pt-8 border-t border-slate-800 space-y-4">
      <a routerLink="/home"
        class="flex items-center gap-3 px-4 py-2 text-sm font-bold text-slate-500 hover:text-white transition-colors">
        <lucide-icon name="home" class="w-4 h-4"></lucide-icon>
        <span>الرئيسية</span>
      </a>
      <button (click)="logout()"
        class="flex items-center gap-3 px-4 py-2 text-sm font-bold text-red-500/70 hover:text-red-400 transition-colors w-full text-right">
        <lucide-icon name="log-out" class="w-4 h-4"></lucide-icon>
        <span>تسجيل الخروج</span>
      </button>
    </div>
  </aside>

  <!-- Mobile Top Bar -->
  <div
    class="lg:hidden fixed top-0 left-0 right-0 z-50 bg-slate-900 shadow-premium flex items-center justify-between px-6 py-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center p-2 shadow-soft">
        <img src="assets/Images/lynx-logo.png" alt="Lynx" class="w-full h-full object-contain">
      </div>
      <div>
        <span class="font-black text-white text-sm block">Lynx</span>
        <span class="text-[10px] text-success-500 font-bold uppercase tracking-widest">المندوب</span>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button (click)="toggleMobileMenu()"
        class="w-11 h-11 rounded-xl bg-white/5 border border-white/10 text-white flex items-center justify-center active:scale-95 transition-all">
        <lucide-icon [name]="isMobileMenuOpen ? 'x' : 'menu'" class="w-6 h-6"></lucide-icon>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Overlay -->
  <div class="lg:hidden fixed inset-0 z-40 transition-all duration-500"
    [ngClass]="{'pointer-events-none opacity-0': !isMobileMenuOpen, 'pointer-events-auto opacity-100': isMobileMenuOpen}">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" (click)="closeMobileMenu()"></div>

    <!-- Mobile Menu -->
    <div
      class="absolute right-0 top-0 h-full w-[280px] bg-slate-900 p-8 transform transition-transform duration-500 shadow-2xl flex flex-col"
      [ngClass]="{'translate-x-full': !isMobileMenuOpen, 'translate-x-0': isMobileMenuOpen}">

      <div class="flex items-center gap-4 mb-10 pb-6 border-b border-slate-800">
        <div class="w-12 h-12 rounded-2xl bg-white flex items-center justify-center p-2 overflow-hidden shadow-soft">
          <img src="assets/Images/lynx-logo.png" alt="Lynx" class="w-full h-full object-contain">
        </div>
        <div>
          <span class="font-black text-white block">{{ userName }}</span>
          <small class="text-success-500 text-xs font-bold uppercase tracking-widest">لوحة المندوب</small>
        </div>
      </div>

      <nav class="flex flex-col gap-1 flex-1">
        <a *ngFor="let item of navItems" [routerLink]="item.path"
          routerLinkActive="bg-white/5 text-white border border-white/10" (click)="closeMobileMenu()"
          class="flex items-center justify-between px-4 py-4 rounded-2xl text-slate-400 transition-all duration-300">
          <div class="flex items-center gap-4">
            <lucide-icon [name]="item.icon" class="w-5 h-5"></lucide-icon>
            <span class="font-bold">{{ item.label }}</span>
          </div>
        </a>
      </nav>

      <div class="mt-auto pt-8 border-t border-slate-800 space-y-4">
        <a routerLink="/home" (click)="closeMobileMenu()"
          class="flex items-center gap-3 px-4 py-2 text-slate-500 font-bold">
          <lucide-icon name="home" class="w-4 h-4"></lucide-icon>
          <span>الرئيسية</span>
        </a>
        <button (click)="logout()"
          class="flex items-center gap-3 px-4 py-2 text-red-500/70 font-bold w-full text-right">
          <lucide-icon name="log-out" class="w-4 h-4"></lucide-icon>
          <span>تسجيل الخروج</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="lg:p-8 pt-24 lg:pt-8 bg-slate-50 min-h-screen">
    <div class="max-w-[1600px] mx-auto">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
